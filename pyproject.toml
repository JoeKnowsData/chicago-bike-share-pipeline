[project]
name = "bikeshare"
version = "0.1.0"
description = "End-to-end pipeline: Chicago Divvy bike trips + NOAA weather -> DuckDB star schema for SQL analysis and Power BI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
bikeshare = "bikeshare.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
